<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
  <title id="title">HowToWriteYourMemoirs logo</title>
  <desc id="desc">Open book with gold quill, navy and gold wordmark, and the tagline Write Your Story. Inspire Others.</desc>

  <rect width="1200" height="240" rx="28" fill="#FFFFFF"/>

  <!-- Open book -->
  <path d="M42 162
           Q92 128 146 146
           L146 80
           Q94 60 42 92 Z"
        fill="none"
        stroke="#102F5C"
        stroke-width="7"
        stroke-linejoin="round"/>
  <path d="M250 162
           Q200 128 146 146
           L146 80
           Q198 60 250 92 Z"
        fill="none"
        stroke="#102F5C"
        stroke-width="7"
        stroke-linejoin="round"/>
  <path d="M42 162 Q94 140 146 162 Q198 140 250 162"
        fill="none"
        stroke="#102F5C"
        stroke-width="7"
        stroke-linecap="round"/>

  <!-- Ink bottle -->
  <rect x="129" y="126" width="34" height="27" rx="5" fill="#102F5C"/>
  <rect x="136" y="115" width="20" height="13" rx="3" fill="#102F5C"/>

  <!-- Quill -->
  <path d="M146 116
           C160 68 181 34 214 16
           C197 44 187 76 180 107
           C171 129 159 146 146 162
           C151 140 154 127 146 116 Z"
        fill="#B8872D"/>
  <path d="M151 113 C165 88 182 63 205 38"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="4"
        stroke-linecap="round"/>

  <!-- Wordmark -->
  <text x="300" y="110"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="68"
        fill="#102F5C">
    HowToWriteYour<tspan fill="#B8872D">Memoirs</tspan>
  </text>

  <!-- Tagline and decorative lines -->
  <line x1="300" y1="164" x2="390" y2="164"
        stroke="#B8872D" stroke-width="4" stroke-linecap="round"/>

  <text x="420" y="172"
        font-family="Arial, Helvetica, sans-serif"
        font-size="21"
        letter-spacing="6"
        fill="#102F5C">
    WRITE YOUR STORY. INSPIRE OTHERS.
  </text>

  <line x1="1045" y1="164" x2="1140" y2="164"
        stroke="#B8872D" stroke-width="4" stroke-linecap="round"/>
</svg>
